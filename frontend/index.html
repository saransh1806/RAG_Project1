
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT 6.006 AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <header class="header">
            <div class="brand">
                <div class="logo">AI</div>
                <div>
                    <h2>MIT 6.006 Assistant</h2>
                    <p>AI-powered course companion</p>
                </div>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                Backend connection
            </div>
        </header>

        <main class="chat-container">

            <section class="welcome" id="welcome">
                <h1>Learn. Understand. Master.</h1>
                <p>
                    Ask questions about your MIT 6.006
                    lecture material.
                </p>
            </section>

            <section class="messages" id="messages">
            </section>

            <div class="input-area">
                <form id="chat-form">
                    <textarea
                        id="question-input"
                        placeholder="Ask your question..."
                        rows="1"
                        required
                    ></textarea>

                    <button type="submit" id="send-button">
                        ↑
                    </button>
                </form>
                <p class="input-footer">
                    MIT 6.006 • Retrieval-Augmented Generation
                </p>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
